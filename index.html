    <script>
                        // Evolution chart logic
                        const gradeOrderEvolution = [
                            '3', '4', '5', '6A', '6A+', '6B', '6B+', '6C', '6C+',
                            '7A', '7A+', '7B', '7B+', '7C', '7C+'
                        ];
                        function getHighestLevelEvolution() {
                            // Map: date -> highest grade index for that day
                            const dateToHighestIdx = {};
                            for (let i = 1; i <= 12; i++) {
                                const data = localStorage.getItem('circle' + i);
                                if (data) {
                                    try {
                                        const parsed = JSON.parse(data);
                                        if (parsed.grade && parsed.grade !== 'fun' && Array.isArray(parsed.climbDates)) {
                                            const idx = gradeOrderEvolution.indexOf(parsed.grade);
                                            if (idx >= 0) {
                                                parsed.climbDates.forEach(date => {
                                                    if (!dateToHighestIdx[date] || idx > dateToHighestIdx[date].idx) {
                                                        dateToHighestIdx[date] = { idx, grade: parsed.grade };
                                                    }
                                                });
                                            }
                                        }
                                    } catch (e) {}
                                }
                            }
                            // Sort dates ascending
                            const sortedDates = Object.keys(dateToHighestIdx).sort();
                            return sortedDates.map(date => ({ date, idx: dateToHighestIdx[date].idx, grade: dateToHighestIdx[date].grade }));
                        }

                        const evolutionButton = document.getElementById('evolutionButton');
                        const evolutionDialog = document.getElementById('evolutionDialog');
                        const evolutionContent = document.getElementById('evolutionContent');
                        const closeEvolutionButton = document.getElementById('closeEvolutionButton');
                        evolutionButton.addEventListener('click', () => {
                            const evolution = getHighestLevelEvolution();
                            if (evolution.length === 0) {
                                evolutionContent.innerHTML = '<p>No climbs recorded yet.</p>';
                                evolutionDialog.showModal();
                                return;
                            }
                            // Bar chart dimensions
                            const barWidth = 28;
                            const barGap = 8;
                            const chartHeight = 220;
                            const chartWidth = evolution.length * (barWidth + barGap) + 40;
                            let svg = `<svg width="${chartWidth}" height="${chartHeight + 40}">`;
                            evolution.forEach((entry, i) => {
                                const barH = (entry.idx + 1) * (chartHeight / 15); // 1-15 scale
                                const x = 30 + i * (barWidth + barGap);
                                const y = chartHeight - barH + 20;
                                svg += `<rect x="${x}" y="${y}" width="${barWidth}" height="${barH}" fill="#fd7e14" stroke="black" />`;
                                // Grade label above bar
                                svg += `<text x="${x + barWidth/2}" y="${y - 6}" font-size="13" fill="black" text-anchor="middle">${entry.grade}</text>`;
                                // Date label below bar (short)
                                svg += `<text x="${x + barWidth/2}" y="${chartHeight + 32}" font-size="11" fill="#555" text-anchor="middle">${entry.date.slice(5)}</text>`;
                            });
                            svg += '</svg>';
                            evolutionContent.innerHTML = svg;
                            evolutionDialog.showModal();
                        });
                        closeEvolutionButton.addEventListener('click', () => {
                            evolutionDialog.close();
                        });
                        // Highest level today logic
                        function getHighestLevelClimbedToday() {
                            const gradeOrderForCompare = [
                                '3', '4', '5', '6A', '6A+', '6B', '6B+', '6C', '6C+',
                                '7A', '7A+', '7B', '7B+', '7C', '7C+'
                            ];
                            let highestIdx = -1;
                            let highestGrade = null;
                            const today = new Date().toISOString().slice(0, 10);
                            for (let i = 1; i <= 12; i++) {
                                const data = localStorage.getItem('circle' + i);
                                if (data) {
                                    try {
                                        const parsed = JSON.parse(data);
                                        if (parsed.grade && parsed.grade !== 'fun' && Array.isArray(parsed.climbDates)) {
                                            // Only count if climbed today
                                            if (parsed.climbDates.some(d => d === today)) {
                                                const idx = gradeOrderForCompare.indexOf(parsed.grade);
                                                if (idx > highestIdx) {
                                                    highestIdx = idx;
                                                    highestGrade = parsed.grade;
                                                }
                                            }
                                        }
                                    } catch (e) {}
                                }
                            }
                            return highestGrade;
                        }

                        const levelTodayButton = document.getElementById('levelTodayButton');
                        const levelTodayDialog = document.getElementById('levelTodayDialog');
                        const levelTodayContent = document.getElementById('levelTodayContent');
                        const closeLevelTodayButton = document.getElementById('closeLevelTodayButton');
                        levelTodayButton.addEventListener('click', () => {

                        // Highest level logic
                        const gradeOrderForCompare = [
                            '3', '4', '5', '6A', '6A+', '6B', '6B+', '6C', '6C+',
                            '7A', '7A+', '7B', '7B+', '7C', '7C+'
                        ];
                        function getHighestLevelClimbed() {
                            let highestIdx = -1;
                            let highestGrade = null;
                            for (let i = 1; i <= 12; i++) {
                                const data = localStorage.getItem('circle' + i);
                                if (data) {
                                    try {
                                        const parsed = JSON.parse(data);
                                        if (parsed.grade && parsed.grade !== 'fun' && parsed.climbed > 0) {
                                            const idx = gradeOrderForCompare.indexOf(parsed.grade);
                                            if (idx > highestIdx) {
                                                highestIdx = idx;
                                                highestGrade = parsed.grade;
                                            }
                                        }
                                    } catch (e) {}
                                }
                            }
                            return highestGrade;

                        const highestLevelDialog = document.getElementById('highestLevelDialog');

                        const closeHighestLevelButton = document.getElementById('closeHighestLevelButton');
                        highestLevelButton.addEventListener('click', () => {

                        // Bar chart for today stats
                        function renderTodayStatsBarChart() {
                            const gradeOrder = [
                                '3', '4', '5', '6A', '6A+', '6B', '6B+', '6C', '6C+',
                                '7A', '7A+', '7B', '7B+', '7C', '7C+', 'fun'
                            ];
                            const gradeCounts = {};
                            gradeOrder.forEach(g => gradeCounts[g] = 0);
                            const today = new Date().toISOString().slice(0, 10);
                            for (let i = 1; i <= 12; i++) {
                                const data = localStorage.getItem('circle' + i);
                                if (data) {
                                    try {
                                        const parsed = JSON.parse(data);
                                        if (parsed.grade && Array.isArray(parsed.climbDates)) {
                                            // Count only climbs with today's date
                                            const todayClimbs = parsed.climbDates.filter(d => d === today).length;
                                            if (gradeCounts.hasOwnProperty(parsed.grade)) {
                                                gradeCounts[parsed.grade] += todayClimbs;
                                            }
                                        }
                                    } catch (e) {}
                                }
                            }
                            const filteredGrades = gradeOrder.filter(g => gradeCounts[g] > 0);
                            const barHeight = 28;
                            const barGap = 8;
                            const labelWidth = 32;
                            const leftMargin = 100;
                            const maxCount = Math.max(...filteredGrades.map(g => gradeCounts[g]), 1);
                            const chartWidth = Math.min(340, document.getElementById('todayStatsContent').offsetWidth || 340);
                            const maxBarWidth = chartWidth - leftMargin - labelWidth - 8;
                            let svg = `<svg width="${chartWidth}" height="${filteredGrades.length * (barHeight + barGap)}">`;
                            filteredGrades.forEach((grade, idx) => {
                                const count = gradeCounts[grade];
                                const color = getGradeColor(grade);
                                const barW = Math.max(10, Math.round((count / maxCount) * maxBarWidth));
                                const y = idx * (barHeight + barGap);
                                svg += `<rect x="${leftMargin}" y="${y}" width="${barW}" height="${barHeight}" fill="${color}" stroke="black" />`;
                                svg += `<text x="10" y="${y + barHeight/2 + 7}" font-size="18" fill="black">${grade}</text>`;
                                const labelX = leftMargin + barW + 8;
                                svg += `<text x="${labelX}" y="${y + barHeight/2 + 7}" font-size="18" fill="black">${count}</text>`;
                            });
                            svg += '</svg>';
                            document.getElementById('todayStatsContent').innerHTML = filteredGrades.length ? svg : '<p>No climbs today.</p>';
                        }
                        // Bar chart for stats
                        function renderStatsBarChart() {
                            // Grade order
                            const gradeOrder = [
                                '3', '4', '5', '6A', '6A+', '6B', '6B+', '6C', '6C+',
                                '7A', '7A+', '7B', '7B+', '7C', '7C+', 'fun'
                            ];
                            // Count climbs per grade
                            const gradeCounts = {};
                            gradeOrder.forEach(g => gradeCounts[g] = 0);
                            for (let i = 1; i <= 12; i++) {
                                const data = localStorage.getItem('circle' + i);
                                if (data) {
                                    try {
                                        const parsed = JSON.parse(data);
                                        if (parsed.grade && typeof parsed.climbed === 'number') {
                                            if (gradeCounts.hasOwnProperty(parsed.grade)) {
                                                gradeCounts[parsed.grade] += parsed.climbed;
                                            }
                                        }
                                    } catch (e) {}
                                }
                            }
                            // Filter out grades with zero climbs
                            const filteredGrades = gradeOrder.filter(g => gradeCounts[g] > 0);
                            // Bar chart dimensions
                            const barHeight = 28;
                            const barGap = 8;
                            const labelWidth = 32;
                            const leftMargin = 100;
                            // Find the max count for scaling
                            const maxCount = Math.max(...filteredGrades.map(g => gradeCounts[g]), 1);
                            // Chart width so the longest bar plus label fits
                            const chartWidth = Math.min(340, document.getElementById('statsContent').offsetWidth || 340);
                            const maxBarWidth = chartWidth - leftMargin - labelWidth - 8;
                            // Build SVG bars
                            let svg = `<svg width="${chartWidth}" height="${filteredGrades.length * (barHeight + barGap)}">`;
                            filteredGrades.forEach((grade, idx) => {
                                const count = gradeCounts[grade];
                                const color = getGradeColor(grade);
                                const barW = Math.max(10, Math.round((count / maxCount) * maxBarWidth));
                                const y = idx * (barHeight + barGap);
                                svg += `<rect x="${leftMargin}" y="${y}" width="${barW}" height="${barHeight}" fill="${color}" stroke="black" />`;
                                svg += `<text x="10" y="${y + barHeight/2 + 7}" font-size="18" fill="black">${grade}</text>`;
                                // Count label always next to bar
                                const labelX = leftMargin + barW + 8;
                                svg += `<text x="${labelX}" y="${y + barHeight/2 + 7}" font-size="18" fill="black">${count}</text>`;
                            });
                            svg += '</svg>';
                            // Show chart
                            document.getElementById('statsContent').innerHTML = filteredGrades.length ? svg : '<p>No climbs yet.</p>';
                        }

        const circles = document.querySelectorAll('circle');

        let selectedCircle = null;

        // Grade to color mapping
        function getGradeColor(grade) {
            switch (grade) {
                case '3': return 'gray';
                case '4': return 'green';
                case '5': return 'orange';
                case '6A': return 'yellow';
                case '6A+': return '#bfa900'; // darker yellow
                case '6B': return 'blue';
                case '6B+': return '#003399'; // darker blue
                case '6C': return 'red';
                case '6C+': return '#990000'; // darker red
                case '7A': return '#222'; // very dark grey
                case '7A+': return '#111'; // even darker grey
                case '7B': return 'white';
                case '7B+': return '#f5f5f5'; // off-white
                case '7C': return 'purple';
                case '7C+': return '#4b006e'; // dark purple
                case 'fun': return 'pink';
                default: return 'white';
            }
        }

        // Initialize circle colors and plus signs based on stored boulders
        circles.forEach(circle => {
            const plusId = circle.id.replace('circle', 'plus');
            const plusGroupId = plusId + 'group';
            const plusGroup = document.getElementById(plusGroupId);
            const boulderData = localStorage.getItem(circle.id);
            let validData = null;
            if (boulderData) {
                try {
                    validData = JSON.parse(boulderData);
                } catch (e) {
                    // Invalid/corrupt data, clean it up
                    localStorage.removeItem(circle.id);
                }
            }
            if (validData) {
                const { grade } = validData;
                circle.setAttribute('fill', getGradeColor(grade));
                circle.setAttribute('stroke', 'black');
                if (plusGroup) plusGroup.style.display = 'none';
            } else {
                circle.setAttribute('fill', 'white');
                circle.setAttribute('stroke', 'black');
                if (plusGroup) plusGroup.style.display = 'block';
            }
        });

        circles.forEach(circle => {
            const plusId = circle.id.replace('circle', 'plus');
            const plusGroupId = plusId + 'group';
            const plusRect = document.querySelector(`#${plusGroupId} rect`);
            const plusText = document.getElementById(plusId);
            // Attach event listeners to both rect and text for maximum reliability
            [plusRect, plusText].forEach(plusElem => {
                if (plusElem) {
                    plusElem.addEventListener('click', (event) => {
                        console.log('Clicked + for', circle.id);
                        event.stopPropagation();
                        selectedCircle = circle;
                        addDialog.showModal();
                        boulderNameInput.focus();
                    });
                }
            });
            // Add event listener to the circle for viewing a boulder (only if it exists)
            circle.addEventListener('click', () => {
                const boulderData = localStorage.getItem(circle.id);
                if (boulderData) {
                    let validData = null;
                    try {
                        validData = JSON.parse(boulderData);
                    } catch (e) {
                        localStorage.removeItem(circle.id);
                    }
                    if (validData) {
                        selectedCircle = circle;
                        const { name, grade } = validData;
                        document.getElementById('boulderTitle').textContent = `Boulder ${name}`;
                        document.getElementById('boulderInfo').textContent = `Grade: ${grade}`;
                        // Set the color of the grade circle
                        const gradeCircle = document.getElementById('gradeCircle');
                        if (gradeCircle) {
                            gradeCircle.setAttribute('fill', getGradeColor(grade));
                        }
                        // Set the background color and text color of the title bar
                        const titleBar = document.getElementById('boulderTitleBar');
                        const titleText = document.getElementById('boulderTitle');
                        if (titleBar && titleText) {
                            const bg = getGradeColor(grade);
                            titleBar.style.background = bg;
                            // Function to determine if color is dark
                            function isDarkColor(color) {
                                // Accepts named colors and hex
                                const ctx = document.createElement('canvas').getContext('2d');
                                ctx.fillStyle = color;
                                const computed = ctx.fillStyle;
                                // Convert to rgb
                                ctx.fillStyle = computed;
                                const rgb = ctx.fillStyle.match(/^#([0-9a-f]{6})$/i) ?
                                    computed.match(/^#(..)(..)(..)$/).slice(1).map(x => parseInt(x, 16)) :
                                    ctx.getImageData(0,0,1,1).data.slice(0,3);
                                // Perceived brightness
                                const brightness = (rgb[0]*299 + rgb[1]*587 + rgb[2]*114) / 1000;
                                return brightness < 128;
                            }
                            if (isDarkColor(bg)) {
                                titleText.style.color = 'white';
                            } else {
                                titleText.style.color = 'black';
                            }
                        }
                        // Show climbed count (always fetch fresh from storage)
                        const climbedCountLabel = document.getElementById('climbedCountLabel');
                        let climbed = 0;
                        const latestData = localStorage.getItem(circle.id);
                        if (latestData) {
                            try {
                                const parsed = JSON.parse(latestData);
                                climbed = parsed.climbed || 0;
                            } catch (e) {}
                        }
                        climbedCountLabel.textContent = `# climbed: ${climbed}`;
                        // Store selected boulder data for the climbed button
                        viewDialog.dataset.selectedCircleId = circle.id;
                        viewDialog.showModal();
                            // Handle 'Climbed' button click (attach only once)
                            const climbedButton = document.getElementById('climbedButton');
                            if (!climbedButton.dataset.listenerAttached) {
                                climbedButton.addEventListener('click', () => {
                                    const circleId = viewDialog.dataset.selectedCircleId;
                                    if (!circleId) return;
                                    let boulderData = localStorage.getItem(circleId);
                                    let validData = null;
                                    if (boulderData) {
                                        try {
                                            validData = JSON.parse(boulderData);
                                        } catch (e) {
                                            localStorage.removeItem(circleId);
                                        }
                                    }
                                    if (validData) {
                                        validData.climbed = (validData.climbed || 0) + 1;
                                        const today = new Date().toISOString().slice(0, 10);
                                        if (!Array.isArray(validData.climbDates)) validData.climbDates = [];
                                        validData.climbDates.push(today);
                                        localStorage.setItem(circleId, JSON.stringify(validData));
                                        // Always fetch the latest count from storage and update the label
                                        let climbed = 0;
                                        const latestData = localStorage.getItem(circleId);
                                        if (latestData) {
                                            try {
                                                const parsed = JSON.parse(latestData);
                                                climbed = parsed.climbed || 0;
                                            } catch (e) {}
                                        }
                                        const climbedCountLabel = document.getElementById('climbedCountLabel');
                                        climbedCountLabel.textContent = `# climbed: ${climbed}`;
                                    }
                                });
                                climbedButton.dataset.listenerAttached = 'true';
                            }
                    }
                }
            });
        });

        addButton.addEventListener('click', () => {
            const name = boulderNameInput.value.trim();
            const grade = boulderGradeInput.value;
            if (name) {
                const boulderData = JSON.stringify({ name, grade, climbed: 0, climbDates: [] });;
                localStorage.setItem(selectedCircle.id, boulderData);
                const fillColor = getGradeColor(grade);
                selectedCircle.setAttribute('fill', fillColor);
                selectedCircle.setAttribute('stroke', 'black');
                const plusId = selectedCircle.id.replace('circle', 'plus');
                const plusGroupId = plusId + 'group';
                const plusGroup = document.getElementById(plusGroupId);
                if (plusGroup) plusGroup.style.display = 'none';
                console.log(`Added boulder "${name}" (grade: ${grade}) at ${selectedCircle.id}`);
                boulderNameInput.value = '';
                addDialog.close();
            } else {
                alert('Please enter a boulder name.');
            }
        });

        closeButton.addEventListener('click', () => {
            viewDialog.close();
        });

        deleteButton.addEventListener('click', () => {
            if (confirm('Are you sure you want to delete this boulder?')) {
                localStorage.removeItem(selectedCircle.id);
                selectedCircle.setAttribute('fill', 'white');
                selectedCircle.setAttribute('stroke', 'black');
                const plusId = selectedCircle.id.replace('circle', 'plus');
                const plusGroupId = plusId + 'group';
                const plusGroup = document.getElementById(plusGroupId);
                if (plusGroup) plusGroup.style.display = 'block';
                viewDialog.close();
            }
        });

        // Close dialogs on outside click or escape
        addDialog.addEventListener('click', (e) => {
            if (e.target === addDialog) {
                addDialog.close();
            }
        });

        viewDialog.addEventListener('click', (e) => {
            if (e.target === viewDialog) {
                viewDialog.close();
            }
        });
    </script>
</body>
</html>
