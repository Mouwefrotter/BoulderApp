<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boulder Gym Map</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        svg {
            border: 1px solid #ccc;
        }
        /* Make all plus signs and their clickable areas show a pointer cursor */
        #plus1, #plus2, #plus3, #plus4, #plus5, #plus6, #plus7, #plus8, #plus9, #plus10, #plus11, #plus12,
        #plus1group, #plus2group, #plus3group, #plus4group, #plus5group, #plus6group, #plus7group, #plus8group, #plus9group, #plus10group, #plus11group, #plus12group,
        #plus1group rect, #plus2group rect, #plus3group rect, #plus4group rect, #plus5group rect, #plus6group rect, #plus7group rect, #plus8group rect, #plus9group rect, #plus10group rect, #plus11group rect, #plus12group rect {
            cursor: pointer;
        }
        dialog {
            padding: 20px;
            border: 2px solid black;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        dialog::backdrop {
            background: rgba(0,0,0,0.5);
        }
        input {
            margin: 10px 0;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <svg width="700" height="400" viewBox="0 0 700 400">
        <!-- Hexagon 1 (left) -->
        <circle cx="180" cy="80" r="20" fill="white" stroke="black" stroke-width="2" id="circle1"></circle>
        <g id="plus1group"><rect x="165" y="65" width="30" height="30" fill="transparent" style="pointer-events: all;"></rect><text x="180" y="90" text-anchor="middle" fill="black" font-size="20" id="plus1" style="pointer-events: all;">+</text></g>
        <circle cx="240" cy="120" r="20" fill="white" stroke="black" stroke-width="2" id="circle2"></circle>
        <g id="plus2group"><rect x="225" y="105" width="30" height="30" fill="transparent" style="pointer-events: all;"></rect><text x="240" y="130" text-anchor="middle" fill="black" font-size="20" id="plus2" style="pointer-events: all;">+</text></g>
        <circle cx="240" cy="190" r="20" fill="white" stroke="black" stroke-width="2" id="circle3"></circle>
        <g id="plus3group"><rect x="225" y="175" width="30" height="30" fill="transparent" style="pointer-events: all;"></rect><text x="240" y="200" text-anchor="middle" fill="black" font-size="20" id="plus3" style="pointer-events: all;">+</text></g>
        <circle cx="180" cy="230" r="20" fill="white" stroke="black" stroke-width="2" id="circle4"></circle>
        <g id="plus4group"><rect x="165" y="215" width="30" height="30" fill="transparent" style="pointer-events: all;"></rect><text x="180" y="240" text-anchor="middle" fill="black" font-size="20" id="plus4" style="pointer-events: all;">+</text></g>
        <circle cx="120" cy="190" r="20" fill="white" stroke="black" stroke-width="2" id="circle5"></circle>
        <g id="plus5group"><rect x="105" y="175" width="30" height="30" fill="transparent" style="pointer-events: all;"></rect><text x="120" y="200" text-anchor="middle" fill="black" font-size="20" id="plus5" style="pointer-events: all;">+</text></g>
        <circle cx="120" cy="120" r="20" fill="white" stroke="black" stroke-width="2" id="circle6"></circle>
        <g id="plus6group"><rect x="105" y="105" width="30" height="30" fill="transparent" style="pointer-events: all;"></rect><text x="120" y="130" text-anchor="middle" fill="black" font-size="20" id="plus6" style="pointer-events: all;">+</text></g>
        <!-- Hexagon 2 (right) -->
        <circle cx="520" cy="80" r="20" fill="white" stroke="black" stroke-width="2" id="circle7"></circle>
        <g id="plus7group"><rect x="505" y="65" width="30" height="30" fill="transparent" style="pointer-events: all;"></rect><text x="520" y="90" text-anchor="middle" fill="black" font-size="20" id="plus7" style="pointer-events: all;">+</text></g>
        <circle cx="580" cy="120" r="20" fill="white" stroke="black" stroke-width="2" id="circle8"></circle>
        <g id="plus8group"><rect x="565" y="105" width="30" height="30" fill="transparent" style="pointer-events: all;"></rect><text x="580" y="130" text-anchor="middle" fill="black" font-size="20" id="plus8" style="pointer-events: all;">+</text></g>
        <circle cx="580" cy="190" r="20" fill="white" stroke="black" stroke-width="2" id="circle9"></circle>
        <g id="plus9group"><rect x="565" y="175" width="30" height="30" fill="transparent" style="pointer-events: all;"></rect><text x="580" y="200" text-anchor="middle" fill="black" font-size="20" id="plus9" style="pointer-events: all;">+</text></g>
        <circle cx="520" cy="230" r="20" fill="white" stroke="black" stroke-width="2" id="circle10"></circle>
        <g id="plus10group"><rect x="505" y="215" width="30" height="30" fill="transparent" style="pointer-events: all;"></rect><text x="520" y="240" text-anchor="middle" fill="black" font-size="20" id="plus10" style="pointer-events: all;">+</text></g>
        <circle cx="460" cy="190" r="20" fill="white" stroke="black" stroke-width="2" id="circle11"></circle>
        <g id="plus11group"><rect x="445" y="175" width="30" height="30" fill="transparent" style="pointer-events: all;"></rect><text x="460" y="200" text-anchor="middle" fill="black" font-size="20" id="plus11" style="pointer-events: all;">+</text></g>
        <circle cx="460" cy="120" r="20" fill="white" stroke="black" stroke-width="2" id="circle12"></circle>
        <g id="plus12group"><rect x="445" y="105" width="30" height="30" fill="transparent" style="pointer-events: all;"></rect><text x="460" y="130" text-anchor="middle" fill="black" font-size="20" id="plus12" style="pointer-events: all;">+</text></g>
    </svg>

    <dialog id="boulderDialog">
        <h3>Add Boulder Problem</h3>
        <label for="boulderName">Boulder Name:</label>
        <input type="text" id="boulderName" placeholder="Enter boulder name">
        <label for="boulderGrade">Grade:</label>
        <select id="boulderGrade">
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6A">6A</option>
            <option value="6A+">6A+</option>
            <option value="6B">6B</option>
            <option value="6B+">6B+</option>
            <option value="6C">6C</option>
            <option value="6C+">6C+</option>
            <option value="7A">7A</option>
            <option value="7A+">7A+</option>
            <option value="7B">7B</option>
            <option value="7B+">7B+</option>
            <option value="7C">7C</option>
            <option value="7C+">7C+</option>
            <option value="fun">fun</option>
        </select>
        <button id="addButton">Add Boulder</button>
    </dialog>

    <dialog id="viewDialog">
        <div id="boulderTitleBar" style="padding: 8px 0; border-radius: 8px 8px 0 0; margin: -20px -20px 12px -20px; text-align: center;">
            <h3 id="boulderTitle" style="margin: 0;">Boulder</h3>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
            <svg id="gradeCircleSvg" width="40" height="40" style="flex-shrink: 0;">
                <circle id="gradeCircle" cx="20" cy="20" r="18" fill="white" stroke="black" stroke-width="2" />
            </svg>
            <span id="boulderInfo"></span>
        </div>
        <div style="margin-bottom: 8px;">
            <span id="climbedCountLabel"># climbed: 0</span>
        </div>
        <button id="climbedButton" style="margin-bottom: 8px;">Climbed</button>
        <button id="closeButton">Close</button>
        <button id="deleteButton">Delete</button>
    </dialog>

    <script>
        const circles = document.querySelectorAll('circle');
        const addDialog = document.getElementById('boulderDialog');
        const viewDialog = document.getElementById('viewDialog');
        const boulderNameInput = document.getElementById('boulderName');
        const boulderGradeInput = document.getElementById('boulderGrade');
        const addButton = document.getElementById('addButton');
        const closeButton = document.getElementById('closeButton');
        const boulderInfo = document.getElementById('boulderInfo');
        const boulderTitle = document.getElementById('boulderTitle');
        const deleteButton = document.getElementById('deleteButton');

        let selectedCircle = null;

        // Grade to color mapping
        function getGradeColor(grade) {
            switch (grade) {
                case '3': return 'gray';
                case '4': return 'green';
                case '5': return 'orange';
                case '6A': return 'yellow';
                case '6A+': return '#bfa900'; // darker yellow
                case '6B': return 'blue';
                case '6B+': return '#003399'; // darker blue
                case '6C': return 'red';
                case '6C+': return '#990000'; // darker red
                case '7A': return '#222'; // very dark grey
                case '7A+': return '#111'; // even darker grey
                case '7B': return 'white';
                case '7B+': return '#f5f5f5'; // off-white
                case '7C': return 'purple';
                case '7C+': return '#4b006e'; // dark purple
                case 'fun': return 'pink';
                default: return 'white';
            }
        }

        // Initialize circle colors and plus signs based on stored boulders
        circles.forEach(circle => {
            const plusId = circle.id.replace('circle', 'plus');
            const plusGroupId = plusId + 'group';
            const plusGroup = document.getElementById(plusGroupId);
            const boulderData = localStorage.getItem(circle.id);
            let validData = null;
            if (boulderData) {
                try {
                    validData = JSON.parse(boulderData);
                } catch (e) {
                    // Invalid/corrupt data, clean it up
                    localStorage.removeItem(circle.id);
                }
            }
            if (validData) {
                const { grade } = validData;
                circle.setAttribute('fill', getGradeColor(grade));
                circle.setAttribute('stroke', 'black');
                if (plusGroup) plusGroup.style.display = 'none';
            } else {
                circle.setAttribute('fill', 'white');
                circle.setAttribute('stroke', 'black');
                if (plusGroup) plusGroup.style.display = 'block';
            }
        });

        circles.forEach(circle => {
            const plusId = circle.id.replace('circle', 'plus');
            const plusGroupId = plusId + 'group';
            const plusRect = document.querySelector(`#${plusGroupId} rect`);
            const plusText = document.getElementById(plusId);
            // Attach event listeners to both rect and text for maximum reliability
            [plusRect, plusText].forEach(plusElem => {
                if (plusElem) {
                    plusElem.addEventListener('click', (event) => {
                        console.log('Clicked + for', circle.id);
                        event.stopPropagation();
                        selectedCircle = circle;
                        addDialog.showModal();
                        boulderNameInput.focus();
                    });
                }
            });
            // Add event listener to the circle for viewing a boulder (only if it exists)
            circle.addEventListener('click', () => {
                const boulderData = localStorage.getItem(circle.id);
                if (boulderData) {
                    let validData = null;
                    try {
                        validData = JSON.parse(boulderData);
                    } catch (e) {
                        localStorage.removeItem(circle.id);
                    }
                    if (validData) {
                        selectedCircle = circle;
                        const { name, grade } = validData;
                        document.getElementById('boulderTitle').textContent = `Boulder ${name}`;
                        document.getElementById('boulderInfo').textContent = `Grade: ${grade}`;
                        // Set the color of the grade circle
                        const gradeCircle = document.getElementById('gradeCircle');
                        if (gradeCircle) {
                            gradeCircle.setAttribute('fill', getGradeColor(grade));
                        }
                        // Set the background color and text color of the title bar
                        const titleBar = document.getElementById('boulderTitleBar');
                        const titleText = document.getElementById('boulderTitle');
                        if (titleBar && titleText) {
                            const bg = getGradeColor(grade);
                            titleBar.style.background = bg;
                            // Function to determine if color is dark
                            function isDarkColor(color) {
                                // Accepts named colors and hex
                                const ctx = document.createElement('canvas').getContext('2d');
                                ctx.fillStyle = color;
                                const computed = ctx.fillStyle;
                                // Convert to rgb
                                ctx.fillStyle = computed;
                                const rgb = ctx.fillStyle.match(/^#([0-9a-f]{6})$/i) ?
                                    computed.match(/^#(..)(..)(..)$/).slice(1).map(x => parseInt(x, 16)) :
                                    ctx.getImageData(0,0,1,1).data.slice(0,3);
                                // Perceived brightness
                                const brightness = (rgb[0]*299 + rgb[1]*587 + rgb[2]*114) / 1000;
                                return brightness < 128;
                            }
                            if (isDarkColor(bg)) {
                                titleText.style.color = 'white';
                            } else {
                                titleText.style.color = 'black';
                            }
                        }
                        // Show climbed count (always fetch fresh from storage)
                        const climbedCountLabel = document.getElementById('climbedCountLabel');
                        let climbed = 0;
                        const latestData = localStorage.getItem(circle.id);
                        if (latestData) {
                            try {
                                const parsed = JSON.parse(latestData);
                                climbed = parsed.climbed || 0;
                            } catch (e) {}
                        }
                        climbedCountLabel.textContent = `# climbed: ${climbed}`;
                        // Store selected boulder data for the climbed button
                        viewDialog.dataset.selectedCircleId = circle.id;
                        viewDialog.showModal();
                            // Handle 'Climbed' button click (attach only once)
                            const climbedButton = document.getElementById('climbedButton');
                            if (!climbedButton.dataset.listenerAttached) {
                                climbedButton.addEventListener('click', () => {
                                    const circleId = viewDialog.dataset.selectedCircleId;
                                    if (!circleId) return;
                                    let boulderData = localStorage.getItem(circleId);
                                    let validData = null;
                                    if (boulderData) {
                                        try {
                                            validData = JSON.parse(boulderData);
                                        } catch (e) {
                                            localStorage.removeItem(circleId);
                                        }
                                    }
                                    if (validData) {
                                        validData.climbed = (validData.climbed || 0) + 1;
                                        localStorage.setItem(circleId, JSON.stringify(validData));
                                        // Always fetch the latest count from storage and update the label
                                        let climbed = 0;
                                        const latestData = localStorage.getItem(circleId);
                                        if (latestData) {
                                            try {
                                                const parsed = JSON.parse(latestData);
                                                climbed = parsed.climbed || 0;
                                            } catch (e) {}
                                        }
                                        const climbedCountLabel = document.getElementById('climbedCountLabel');
                                        climbedCountLabel.textContent = `# climbed: ${climbed}`;
                                    }
                                });
                                climbedButton.dataset.listenerAttached = 'true';
                            }
                    }
                }
            });
        });

        addButton.addEventListener('click', () => {
            const name = boulderNameInput.value.trim();
            const grade = boulderGradeInput.value;
            if (name) {
                const boulderData = JSON.stringify({ name, grade, climbed: 0 });
                localStorage.setItem(selectedCircle.id, boulderData);
                const fillColor = getGradeColor(grade);
                selectedCircle.setAttribute('fill', fillColor);
                selectedCircle.setAttribute('stroke', 'black');
                const plusId = selectedCircle.id.replace('circle', 'plus');
                const plusGroupId = plusId + 'group';
                const plusGroup = document.getElementById(plusGroupId);
                if (plusGroup) plusGroup.style.display = 'none';
                console.log(`Added boulder "${name}" (grade: ${grade}) at ${selectedCircle.id}`);
                boulderNameInput.value = '';
                addDialog.close();
            } else {
                alert('Please enter a boulder name.');
            }
        });

        closeButton.addEventListener('click', () => {
            viewDialog.close();
        });

        deleteButton.addEventListener('click', () => {
            if (confirm('Are you sure you want to delete this boulder?')) {
                localStorage.removeItem(selectedCircle.id);
                selectedCircle.setAttribute('fill', 'white');
                selectedCircle.setAttribute('stroke', 'black');
                const plusId = selectedCircle.id.replace('circle', 'plus');
                const plusGroupId = plusId + 'group';
                const plusGroup = document.getElementById(plusGroupId);
                if (plusGroup) plusGroup.style.display = 'block';
                viewDialog.close();
            }
        });

        // Close dialogs on outside click or escape
        addDialog.addEventListener('click', (e) => {
            if (e.target === addDialog) {
                addDialog.close();
            }
        });

        viewDialog.addEventListener('click', (e) => {
            if (e.target === viewDialog) {
                viewDialog.close();
            }
        });
    </script>
</body>
</html>
